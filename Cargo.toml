[package]
name = "ara-chat-service"
version = "1.0.0"
edition = "2021"
authors = ["Ara Team"]
description = "Real-time chat service with WebSocket support for instant messaging"

[features]
default = []
test-utils = []

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# JWT
jsonwebtoken = "9"

# Redis
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# PostgreSQL
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }

# Concurrent data structures
dashmap = "6"
smallvec = "1.13"

# Async utilities
futures = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"
async-trait = "0.1"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# OpenTelemetry
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["tonic"] }
opentelemetry-semantic-conventions = "0.27"
tracing-opentelemetry = "0.28"

# Error handling
thiserror = "2"
anyhow = "1"

# Configuration
config = "0.14"
dotenvy = "0.15"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Random (for jitter in backoff)
rand = "0.8"

# Prometheus metrics
prometheus = "0.13"
lazy_static = "1.5"

# SHA256 for direct message lookup hash
sha2 = "0.10"

# CRC16 for Redis Cluster slot calculation
crc16 = "0.4"

# Regex for mention parsing (lightweight)
regex-lite = "0.1"

# Security - input sanitization
html-escape = "0.2"

# HTTP client for link preview fetching
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# HTML parsing for Open Graph extraction
scraper = "0.22"

# Markdown parsing for rendering hints
pulldown-cmark = "0.12"

# URL parsing and validation
url = "2"

# Email sending (SMTP)
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls", "builder"] }

# Compression
zstd = "0.13"

# File upload - image processing
image = "0.24"

# MIME type detection
mime_guess = "2.0"

# Pin transitive dependencies for Rust 1.83 compatibility
home = "=0.5.9"
backon = "=1.2.0"
base64ct = "=1.6.0"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.15"
mockall = "0.13"
fake = { version = "3", features = ["uuid", "chrono"] }
rstest = "0.21"
claim = "0.5"
# Integration testing
axum-test = "16"
hyper = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

[profile.release]
lto = true
codegen-units = 1
